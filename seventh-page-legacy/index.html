function bgUrl(bg){return ['archive','dark'].includes(bg)?'':`url("${A+bg}")`}

function wave(){return `<div class="wave">${[30,62,42,82,48,91,58,36,74,46,86,39,63,28,70,45].map((h,i)=>`<i style="--h:${h}%;--d:${i*.06}s"></i>`).join('')}</div>`}
function dots(){return `<div class="dots">${Array.from({length:22},(_,i)=>`<i style="--s:${7+(i%5)*3}px;--x:${8+(i*37)%84}%;--y:${10+(i*53)%76}%;--d:-${(i%7)*.25}s"></i>`).join('')}</div>`}

case'question':return `<div class="question layer">沈川的选择<br>一定正确吗？</div>`;
case'fullscript':return `<div class="complete-script layer"><div class="complete-script-head"><h2>《消失的第七页航海日志》</h2><div class="music-player"><span>作品配乐</span><audio id="performancePlayer" controls preload="auto" src="${A}voxscape.mp3" aria-label="作品配乐播放器"></audio></div></div><article class="script-flow"><p class="spoken">这里是“追光号”！风力正在增强，无线电即将中断。收到请回答！收到请回答！</p><p>三年前，“追光号”在一片从未被标记的海域，发现了一座隐藏在浓雾中的小岛。夜色里，整座岛泛着幽蓝的微光。所有人都以为，他们找到了传说中的蓝色矿石。</p><p>航海员发来最后一条指令：</p><p class="spoken">“驶向雾岛东侧灯塔，避开西侧暗礁。重复——东侧灯塔，西侧暗礁！”</p><p>可是，当考察员穿过礁石，他们才看清：发光的不是矿石，而是成千上万只银翼海鸟。它们收拢翅膀，守护着刚刚破壳的幼鸟。这里，可能是它们最后一处没有被人类发现的繁殖地。</p><p>就在这时，岸上指挥中心传来命令：</p><p class="spoken">“立即报告雾岛坐标！只要抢先公布发现，‘追光号’的名字，就会被写进海洋考察史。”</p><p>海面上，一艘身份不明的快艇正向雾岛靠近。风浪越来越大，所有人都在等待领队沈川的决定。</p><p class="spoken">“我们离雾岛，只有一海里。再向前一步，我就能得到所有考察者都想得到的荣誉。可是，一旦坐标被送出去，这里就会出现更多船只、更多灯光、更多脚步。到那时，雾岛还会是今天的雾岛吗？”</p><p>沈川沉默了很久。</p><p class="spoken">“追光号全体返航。删除坐标，不带走样本。所有后果，由我承担。”</p><p>后来，人们说沈川害怕风暴，说他在最后一刻选择了退缩。没有人知道，他亲手撕掉的第七页上，写着雾岛唯一的坐标。</p><p>第七页没有被海浪带走，也没有被任何人偷走。它消失，是因为有人放弃了证明自己，把这个秘密，重新交还给大海。</p><p class="ending">沈川的选择一定正确吗？我们也许会有不同的答案。但在听见全部以前，请别急着，替一个人写下结论。</p></article></div>`;

function currentRecord(){let r=0;for(let i=0;i<=index;i++)r=Math.max(r,pages[i].record||0);return r}

function renderEvidence(){const items=evidenceItems(),show=items.length>0;$('visualPanel').classList.toggle('has-evidence',show);$('receiverBar').classList.toggle('show',show);$('receiverBar').innerHTML=show?[0,1].map(a=>`<div class="receiver-row"><span>${a===0?'第一次收到':'第二次收到'}</span>${items.map((x,i)=>`<button data-attempt="${a}" data-evidence="${i}" class="${evidenceMarks[a].has(i)?'on':''}">${evidenceMarks[a].has(i)?'✓ ':''}${x}</button>`).join('')}</div>`).join(''):'';document.querySelectorAll('[data-evidence]').forEach(btn=>btn.onclick=()=>{const a=+btn.dataset.attempt,i=+btn.dataset.evidence;evidenceMarks[a].has(i)?evidenceMarks[a].delete(i):evidenceMarks[a].add(i);renderEvidence()})}

function render(){const p=pages[index];$('app').classList.toggle('cover-mode',p.v==='cover');$('app').classList.toggle('story-image-mode',p.v==='storyfull');$('app').classList.toggle('script-mode',p.v==='fullscript');$('app').classList.toggle('opening-mode',p.v.startsWith('opening'));$('visualPanel').classList.toggle('training-view',p.v==='training');document.body.classList.toggle('silent',p.bg==='dark');$('bg').style.backgroundImage=bgUrl(p.bg);$('bgblur').style.backgroundImage=bgUrl(p.bg);$('group').textContent=p.g;$('eyebrow').textContent=p.e;$('title').textContent=p.t;$('subtitle').textContent=p.s||'';$('subtitle').style.display=p.s?'block':'none';$('script').textContent=p.q||'';$('script').style.display=p.q?'block':'none';$('task').textContent=p.task||'';$('task').style.display=p.task?'inline-flex':'none';renderVisual();renderEvidence();$('rail').innerHTML=rail(currentRecord());$('pageNow').textContent=String(index+1).padStart(2,'0');$('status').textContent=p.e;$('prev').disabled=index===0;$('next').disabled=index===pages.length-1;const explicit=['openingDecode','openingArchive','openingMission','storyfull'].includes(p.v);const canReveal=(p.steps&&!explicit&&p.v!=='cards')||p.lock;$('revealBtn').style.display=canReveal?'block':'none';$('revealBtn').textContent=p.lock?'◦':'＋';$('clickTip').textContent='';$('teacherTitle').textContent=`第${index+1}页｜${p.t}`;$('teacherAction').innerHTML=`<strong>教师触发：</strong>${p.teacher[0]}`;$('teacherTrain').innerHTML=`<strong>训练：</strong>${p.teacher[1]}`;$('teacherPass').innerHTML=`<strong>进入下一步：</strong>${p.teacher[2]}`;renderParticipation();$('stage').style.animation='none';void $('stage').offsetWidth;$('stage').style.animation='enter .45s ease both';if(forcedSilent()&&sound)stopSound();updateSoundButtons()}
function bindInteractive(){document.querySelectorAll('[data-card]').forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.card;if(placements[i]!==null)placements[i]=null;selectedCard=selectedCard===i?null:i;renderVisual()});document.querySelectorAll('[data-zone]').forEach(btn=>btn.onclick=()=>{if(selectedCard===null)return;const z=+btn.dataset.zone;if(placementMap[selectedCard]===z){placements[selectedCard]=z;selectedCard=null;playCue('navigation.wav');renderVisual()}else{btn.classList.add('wrong');playError();setTimeout(()=>btn.classList.remove('wrong'),550)}});const frag=$('fragmentBtn');if(frag)frag.onclick=()=>playFragment(frag);const openingNext=$('openingNext');if(openingNext)openingNext.onclick=()=>{doReveal();playCue('signal-connect.wav')};const missionAccept=$('missionAccept');if(missionAccept)missionAccept.onclick=()=>{doReveal();playCue('signal-connect.wav')};const storyAction=$('storyAction');if(storyAction)storyAction.onclick=()=>{doReveal();playCue('navigation.wav')};const start=$('startPerformance');if(start)start.onclick=startPerformance;const player=$('performancePlayer');if(player)player.volume=.16}

function profile(){const p=performanceActive?performanceScenes[performanceScene]:pages[index];const key=p.g||p.title||'';if(/第五|第六|危险|决定/.test(key))return{cut:560,base:.018,tone:58,pulse:true};if(/第二|第四|雾岛|海鸟/.test(key))return{cut:350,base:.012,tone:174};if(/第三|航线/.test(key))return{cut:700,base:.009,tone:0};if(/第七|真相|archive/.test(key))return{cut:280,base:.007,tone:110};return{cut:720,base:.018,tone:52}}

function stopSound(){if(audio){audio.sources.forEach(s=>{try{s.stop()}catch(e){}});audio.master.disconnect();audio=null}sound=false;paused=false;updateSoundButtons()}

function updateSoundButtons(){const locked=forcedSilent()&&!performanceActive,isMusic=performanceMusicPage()&&!performanceActive;$('soundBtn').disabled=locked;$('pauseBtn').disabled=locked||!sound;$('lowerBtn').disabled=locked||!sound;$('soundBtn').textContent=locked?'本页静音':(isMusic?(sound?(paused?'配乐已暂停':'配乐播放中'):'播放配乐'):(sound?'环境声开':'环境声'));$('soundBtn').title=isMusic?'播放或停止作品配乐（M）':'播放或静音环境声（M)';$('soundBtn').classList.toggle('on',sound);$('pauseBtn').classList.toggle('on',paused);$('lowerBtn').classList.toggle('on',lowered&&sound)}

function renderPerformance(){const s=performanceScenes[performanceScene],url=bgUrl(s.bg);$('perfBlur').style.backgroundImage=url;$('perfImage').innerHTML=s.bg==='archive'?'<article class="paper"><h3>追光号航海日志</h3><p>第七页：</p><p style="margin-top:80px;text-align:center">坐标仍未公开</p></article>':`<img src="${A+s.bg}" alt="${s.title}">`;$('perfTitle').textContent=s.title;$('perfScript').innerHTML=s.script;$('perfProgress').textContent=`${performanceScene+1} / 7`;$('perfPrev').disabled=performanceScene===0;$('perfNext').disabled=performanceScene===6;if(sound){stopSound();startSound()}}
function perfGo(d){performanceScene=Math.max(0,Math.min(6,performanceScene+d));renderPerformance()}
