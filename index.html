rder-color:rgba(255,226,166,.5);box-shadow:0 0 18px rgba(239,185,92,.12)}.path-slot.filled img{opacity:1}.path-slot.filled span{display:none}.sort-actions{display:flex;justify-content:center;align-items:center;gap:12px}.sort-actions .soft{padding:7px 14px}.sort-complete{color:var(--g2);font-weight:700;opacity:0;transition:.3s}.sort-complete.show{opacity:1}@keyframes wrongShake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@media(max-aspect-ratio:4/3){.screen-sorter{gap:9px}.vote-steps{gap:7px}.vote-steps span{padding:6px 10px;font-size:12px}.choice-grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:9px}.story-path{height:96px;gap:7px}.sort-prompt{font-size:18px}}
</style></head><body><main class="deck" id="deck"></main>
<nav class="nav"><div class="navgroup"><button class="icon" id="prev">←</button><button class="icon" id="next">→</button><span class="count" id="count">1 / 21</span></div><div class="progress"><i id="bar"></i></div><div class="navgroup"><button class="icon" id="notesBtn" title="教师提示">N</button><button class="icon" id="fullBtn" title="全屏">⛶</button></div></nav><aside class="notes" id="notes"></aside><div class="lamp-hud" id="lampHud"><div><i class="hud-bulb"></i><small>故事</small></div><div><i class="hud-bulb"></i><small>信息</small></div><div><i class="hud-bulb"></i><small>声音</small></div></div><div class="light-toast" id="lightToast"><div class="toast-bulb"></div><h2 id="toastTitle">能力灯亮了</h2><p id="toastText">挑战完成</p></div>
<script>
const A='./月亮邮局六幅无字图_V1/',O='./月亮邮局开场动画图_V1/';
const scenes=[
['01_月亮邮局里的最后一封无名信.png','最后一封无名信'],['02_面包房第一次寻找.png','第一次寻找'],['03_车站发现灯塔线索.png','灯塔线索'],['04_字迹变淡迎着风浪奔跑.png','字迹变淡，迎着风浪'],['05_灯塔收到小水手的感谢信.png','感谢信送到灯塔'],['06_晨光中的灯塔和回家的船.png','许多人回家的路']];
const note=(title,body)=>`<div class="speaker"><h3>${title}</h3>${body}</div>`;
const head=(ey,title,sub,badge)=>`<header class="head"><p class="ey">${ey}</p><h2>${title}</h2><p class="sub">${sub}</p><span class="badge">${badge}</span></header>`;
const img=(i)=>A+scenes[i][0]; let pages=[];
pages.push(`<section class="slide cover active" data-p="1"><div class="cover-bg"></div><div class="letter-glow"></div><div class="cover-copy"><small>少年闪耀成长计划 · 公开体验课</small><h1>月亮邮局的最后一封信</h1><p>太阳升起以前，最后一封信必须找到收信人。</p></div><button class="primary cover-btn" id="coverStart">让最后一封信亮起来</button>${note('0—3分钟｜只建立规则和悬念','<p>教师拿出实体发光信封：月光信必须在天亮前送到，否则字会消失；信没有名字和地址，只找到三段画面。</p><p>此处不讲完整故事，不让孩子猜标准答案。家长只做听众，不提示。</p>')}</section>`);
pages.push(`<section class="slide mystery" data-p="2"><div class="content three"><figure><img src="${img(0)}"></figure><figure><img src="${img(3)}"></figure><figure><img src="${img(5)}"></figure></div><div class="moonhint"><i></i><i></i><i></i></div>${note('3—10分钟｜三幅图第一次自由讲述','<p>三幅同时出现，无文字。观察20秒，再在心里串联20秒；六名孩子每人30—40秒自由讲。</p><p>教师不示范、不纠正，只在停顿超过3秒时问：先发现什么？接着发生什么？最后到了哪里？这是真实起点，不能删除。</p>')}</section>`);
pages.push(`<section class="slide" data-p="3">${head('公布任务 · 进入完整故事','月光信的三条规则','刚才只有三段画面，还有很多秘密没有讲清。接下来找回六幅完整画面。','10分钟')}<div class="content"><div class="rules" id="ruleCards"><div class="rule panel reveal-card"><b>☀</b><h3>天亮以前送到</h3><p>太阳升起，信上的字会消失</p></div><div class="rule panel reveal-card"><b>✉</b><h3>没有名字和地址</h3><p>只有“最晚关灯的人”这一条线索</p></div><div class="rule panel reveal-card"><b>6</b><h3>找回六幅画面</h3><p>最后每个人独立讲完故事</p></div></div></div><div class="staged-actions"><button class="primary" id="ruleNext">出现下一条规则</button><button class="soft" id="ruleReset">重新隐藏</button></div>${note('10分钟｜三条规则逐个出现','<p>第一次点击：天亮后字会消失。第二次点击：没有姓名地址，只有唯一线索。第三次点击：找回六图，最终每个人独立讲完。</p><p>不要一次展示三条，教师说到哪一条再出现哪一条。</p>')}</section>`);
const storyNotes=[
'讲清月光信规则、无名信和唯一线索；自然说出线索句。','第一次寻找失败：兔奶奶烤完面包会关灯，所以还要继续找。','熊站长指向仍亮着的灯塔，建立跑向灯塔的原因。','天快亮、字迹变淡、风浪出现；说出行动句，急迫但不能喊乱。','完整保留小水手来信的四点：第一次出海害怕、看见灯塔、找到方向、感谢点灯人。','信及时送达，灯塔爷爷看见回家的船；自然说出主题句。'];
scenes.forEach((s,i)=>pages.push(`<section class="slide full" data-p="${i+4}"><img src="${A+s[0]}"><span class="full-label">完整故事 ${i+1} / 6</span><span class="full-tip">教师按母稿节奏手动切换</span>${note(`10—14分钟｜故事图${i+1}`,`<p>${storyNotes[i]}</p><p>不要停下来训练台词或提问。</p>`)}</section>`));
pages.push(`<section class="slide" data-p="10">${head('完整听完后再回答','三个“为什么”','教师逐个放出问题；方框出现后，再点击方框显示答案。','14—16分钟')}<div class="content"><div class="why-grid" id="whyCards"><div class="why panel reveal-card"><div class="why-icon">☀</div><h3>为什么不能等？</h3><p>太阳升起后，月光信上的字会消失。</p></div><div class="why panel reveal-card"><div class="why-icon">◉</div><h3>为什么去灯塔？</h3><p>熊站长看见远处灯塔仍然亮着。</p></div><div class="why panel reveal-card"><div class="why-icon">⛵</div><h3>为什么要感谢？</h3><p>小水手看见灯光，知道回家的方向还在。</p></div></div></div><div class="staged-actions"><button class="primary" id="whyNext">出现下一个“为什么”</button><button class="soft" id="whyReset">重新隐藏</button></div>${note('14—16分钟｜三个为什么逐个出现','<p>先出现太阳问题，孩子回答后点击方框显示答案；再出现灯塔问题；最后出现小船问题。</p><p>每题一人回答、一人补充，不一次把三个问题和答案全部摆出来。</p>')}</section>`);
const shuffled=[3,0,5,2,4,1];
pages.push(`<section class="slide" data-p="11">${head('第一关 · 全班独立判断','六图找路：下一张是哪一号？','每一轮先把答案藏在胸前，倒数以后全班同时亮手指。','16—18分钟')}<div class="content screen-sorter"><div class="vote-steps"><span>① 看六张乱序图</span><span>② 答案藏在胸前</span><span>③ 3·2·1 同时亮手指</span><strong class="sort-prompt" id="sortPrompt">现在找：故事第1张</strong></div><div class="choice-grid" id="sortChoices">${shuffled.map((sceneIndex,choiceIndex)=>`<button class="sort-choice" data-scene="${sceneIndex}"><img src="${img(sceneIndex)}"><b>${choiceIndex+1}号</b></button>`).join('')}</div><div class="story-path" id="sortPath">${scenes.map((_,i)=>`<div class="path-slot"><img alt=""><b>${i+1}</b><span>第${i+1}张</span></div>`).join('')}</div><div class="sort-actions"><button class="soft" id="resetSort">重新找路</button><span class="sort-complete" id="sortComplete">六幅图已连成完整故事小路</span></div></div>${note('16—18分钟｜无实体图卡排序','<p>每轮先提问“故事第几张是哪一号图”，孩子把答案手指藏在胸前；倒数3、2、1后同时亮手指，避免跟随同伴。</p><p>教师观察全班答案，再点击正确图片。每确定一张，请一名孩子用“因为……所以……”说明与上一张的连接。无需打印图卡。</p>')}</section>`);
pages.push(`<section class="slide" data-p="12">${head('不是公布答案 · 而是说清为什么','逐张翻开正确顺序','孩子答对一个连接，教师才翻开下一幅。','18—23分钟')}<div class="content order-grid" id="orderGrid">${scenes.map((s,i)=>`<div class="order-card"><img src="${A+s[0]}"><b class="seq">${i+1}</b></div>`).join('')}</div><div class="bottom-actions"><button class="primary" id="revealNext">回答后翻开下一幅</button><button class="soft" id="hideOrder">重新隐藏</button></div>${note('18—23分钟｜顺序、连接、一图一句','<p>依次追问：为什么无名信在最前？面包房为什么不能接结尾？熊站长指灯塔以后为什么还要跑？为什么感谢信在主题句前？</p><p>六幅全部出现后，所有孩子看着屏幕，用手指沿画面从1走到6，再小声完成一图一句。</p>')}</section>`);
pages.push(`<section class="slide" data-p="13">${head('抽走关键画面 · 检查因果','少了这一幅，故事哪里断了？','分别抽掉图三和图五；孩子要补回事件并说明连接作用。','23—25分钟')}<div class="content gap-grid" id="gapGrid">${scenes.map((s,i)=>`<div class="gap-card" data-gap="${i+1}"><img src="${A+s[0]}"><b class="seq">${i+1}</b></div>`).join('')}</div><div class="bottom-actions"><button class="soft gapBtn" data-gapbtn="3">抽走图三</button><button class="soft gapBtn" data-gapbtn="5">抽走图五</button><button class="primary" id="restoreGap">恢复故事</button></div>${note('23—25分钟｜两处缺口','<p>抽图三：没有熊站长，小狐狸怎么知道去灯塔？抽图五：没有小水手感谢信，灯塔爷爷最后的话为什么出现？</p><p>全班说清两处连接后才能点亮故事灯。</p>')}</section>`);
pages.push(`<section class="slide" data-p="14">${head('第一关完成 · 三盏能力灯出现','今天要点亮三盏灯','能力灯不是装饰；完成对应任务后由教师点击点亮。','25分钟')}<div class="content"><div class="lamp-room"><div class="lamps" id="lampRoom"><div class="lamp"><div class="bulb"></div><h3>故事灯</h3><p>顺序正确，前后相连</p></div><div class="lamp"><div class="bulb"></div><h3>信息灯</h3><p>关键话让听众听懂</p></div><div class="lamp"><div class="bulb"></div><h3>声音灯</h3><p>声音跟着事情变化</p></div></div><button class="primary lamp-action" data-light="0">完成第一关，点亮故事灯</button></div></div>${note('25分钟｜点亮故事灯','<p>确认：六轮都完成独立亮手指判断、孩子能看屏幕一图一句走完、全班说清图三和图五的连接作用。未达到就先补任务，不为效果提前点灯。</p>')}</section>`);
pages.push(`<section class="slide" data-p="15">${head('第二关 · 信息送达','线索句：到底要找谁？','第一次表达—家长说听到什么—只改一个问题—第二次表达。','26—28分30秒')}<div class="content line-scene"><div class="visual panel"><div class="windows"><div class="window"><small>较早</small></div><div class="window"><small>较晚</small></div><div class="window on"><small>最晚</small></div></div><img src="${img(0)}"></div><div class="linebox panel"><span class="context">线索句 · 哪个词决定收信人</span><div class="bigline">请把<span class="focus">这封信</span>／交给／每天晚上<span class="focus">最晚关灯的人</span>。</div><div class="train"><span>按意思分三段</span><span>重点词稍慢、稍稳</span><span>抬头送给听众</span></div><button class="primary listener">家长验证：要送什么？找什么人？</button></div></div>${note('26—28分30秒｜线索句','<p>六个家庭同时说第一遍；家长圈出“什么东西、什么人”。两名孩子公开微训练，其余孩子原位完成第二遍。</p><p>重音不是喊，家长必须能指向最后一个关灯的窗口。</p>')}</section>`);
pages.push(`<section class="slide" data-p="16">${head('第二关 · 气息只为行动服务','行动句：风越大，信息越不能乱','先做吸气—护信—向前一步，再把两条重要信息送清楚。','28分30秒—31分30秒')}<div class="content line-scene"><div class="visual"><img src="${img(3)}"><div class="wind"></div></div><div class="linebox panel"><span class="context">字迹变淡 · 海风出现</span><div class="bigline">请等一等！//<span class="focus">最后一封信</span>／<span class="focus">还没有送到</span>！</div><div class="breath-orb" id="breathOrb">准备</div><div class="train"><span>安静吸一口够用的气</span><span>左手护信，向前一步</span><span>着急，但不喊乱</span></div><div><button class="primary" id="breathBtn">开始情境气息</button> <button class="soft" id="windBtn">低声风声</button></div></div></div>${note('28分30秒—31分30秒｜行动句','<p>全体先无声做“吸气—护信—向前一步”。家长闭眼听：什么信？送到了没有？</p><p>纠正顺序：先喊乱，再换气和句尾，最后才处理动作幅度。风声音量必须低于儿童普通说话声。</p>')}</section>`);
pages.push(`<section class="slide" data-p="17">${head('第二关 · 从一盏灯看到许多人','主题句：灯塔真正守护什么？','先显示一盏灯；孩子回答后，再让回家的船出现。','31分30秒—34分钟')}<div class="content line-scene"><div class="visual"><img src="${img(5)}"><div class="boats" id="boats"></div></div><div class="linebox panel"><span class="context">一盏灯 → 多艘回家的船</span><div class="bigline">我守着的／不只是一盏灯，// 是<span class="focus">许多人／回家的路</span>。</div><div class="train"><span>“不只是一盏灯”后停顿</span><span>保留音量，不模仿老人</span><span>把结尾稳定送给听众</span></div><div><button class="soft" id="boatsBtn">让回家的船出现</button> <button class="primary" data-light="1">完成第二关，点亮信息灯</button></div></div></div>${note('31分30秒—34分钟｜主题句与信息灯','<p>先问：灯塔爷爷只是守着会发光的东西吗？如果灯熄灭，海上的人失去什么？</p><p>家长补全“灯塔爷爷守护的是____”。三句均完成前后训练、每名孩子至少一次公开变化后点亮信息灯。</p>')}</section>`);

const slides=[...document.querySelectorAll('.slide')],notes=document.getElementById('notes');let page=0,lights=[0,0,0];
function show(n){page=Math.max(0,Math.min(slides.length-1,n));if(page===20)lights=[1,1,1];slides.forEach((s,i)=>s.classList.toggle('active',i===page));document.getElementById('count').textContent=`${page+1} / ${slides.length}`;document.getElementById('bar').style.width=`${(page+1)/slides.length*100}%`;notes.innerHTML=slides[page].querySelector('.speaker')?.innerHTML||'';document.getElementById('lampHud').classList.toggle('show',page>=13&&page<=20);renderLights()}
document.getElementById('prev').onclick=()=>show(page-1);document.getElementById('next').onclick=()=>show(page+1);document.getElementById('notesBtn').onclick=()=>notes.classList.toggle('open');document.getElementById('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();page===19?setFinal(fi+1):show(page+1)}if(e.key==='ArrowLeft')page===19?setFinal(fi-1):show(page-1);if(e.key.toLowerCase()==='n')notes.classList.toggle('open');if(e.key.toLowerCase()==='f')document.getElementById('fullBtn').click()});
document.getElementById('coverStart').onclick=e=>{slides[0].classList.add('awake');e.currentTarget.style.opacity=0;try{let a=new(window.AudioContext||window.webkitAudioContext),o=a.createOscillator(),g=a.createGain();o.frequency.value=660;g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(.07,a.currentTime+.03);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.1);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+1.2)}catch(_){}};
document.querySelectorAll('.why').forEach(x=>x.onclick=()=>x.classList.toggle('open'));
function stagedReveal(groupId,nextId,resetId){const cards=[...document.querySelectorAll(`#${groupId} .reveal-card`)];let shown=0;document.getElementById(nextId).onclick=()=>{if(shown<cards.length){cards[shown++].classList.add('shown')}if(shown===cards.length)document.getElementById(nextId).textContent='三项已全部出现'};document.getElementById(resetId).onclick=()=>{shown=0;cards.forEach(x=>{x.classList.remove('shown','open')});document.getElementById(nextId).textContent=groupId==='ruleCards'?'下一条规则':'下一个“为什么”'}}stagedReveal('ruleCards','ruleNext','ruleReset');stagedReveal('whyCards','whyNext','whyReset');
let sortStep=0;const sortChoices=[...document.querySelectorAll('.sort-choice')],pathSlots=[...document.querySelectorAll('.path-slot')],sortPrompt=document.getElementById('sortPrompt'),sortComplete=document.getElementById('sortComplete');function paintSort(){sortPrompt.textContent=sortStep<6?`现在找：故事第${sortStep+1}张`:'顺序找齐！沿着故事小路从1走到6';sortComplete.classList.toggle('show',sortStep===6)}sortChoices.forEach(choice=>choice.onclick=()=>{if(+choice.dataset.scene!==sortStep){choice.classList.remove('wrong');void choice.offsetWidth;choice.classList.add('wrong');setTimeout(()=>choice.classList.remove('wrong'),420);return}const slot=pathSlots[sortStep];slot.querySelector('img').src=img(sortStep);slot.classList.add('filled');choice.classList.add('used');sortStep++;paintSort()});document.getElementById('resetSort').onclick=()=>{sortStep=0;sortChoices.forEach(x=>x.classList.remove('used','wrong'));pathSlots.forEach(x=>{x.classList.remove('filled');x.querySelector('img').removeAttribute('src')});paintSort()};paintSort();
let revealed=0;const order=[...document.querySelectorAll('.order-card')];document.getElementById('revealNext').onclick=()=>{if(revealed<6)order[revealed++].classList.add('reveal')};document.getElementById('hideOrder').onclick=()=>{revealed=0;order.forEach(x=>x.classList.remove('reveal'))};
document.querySelectorAll('.gapBtn').forEach(b=>b.onclick=()=>{let n=b.dataset.gapbtn;document.querySelectorAll('.gap-card').forEach(x=>x.classList.toggle('missing',x.dataset.gap===n))});document.getElementById('restoreGap').onclick=()=>document.querySelectorAll('.gap-card').forEach(x=>x.classList.remove('missing'));
function renderLights(){document.querySelectorAll('.hud-bulb').forEach((x,i)=>x.classList.toggle('lit',lights[i]));document.querySelectorAll('#lampRoom .lamp').forEach((x,i)=>x.classList.toggle('lit',lights[i]))}function celebrateLight(i){const names=['第一盏 · 故事灯','第二盏 · 信息灯','第三盏 · 声音灯'],texts=['顺序正确，前后相连','关键的话，听众已经收到','三种声音进入了完整故事'],toast=document.getElementById('lightToast');document.getElementById('toastTitle').textContent=names[i]+'亮了';document.getElementById('toastText').textContent=texts[i];toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}document.querySelectorAll('[data-light]').forEach(b=>b.onclick=()=>{let i=+b.dataset.light;lights[i]=1;renderLights();celebrateLight(i);b.textContent='挑战完成 · 已点亮'});
let bp=0,bt=null;document.getElementById('breathBtn').onclick=()=>{clearInterval(bt);let phases=[['吸',2,'in'],['停',1,'in'],['说',5,'out']],i=0,left=phases[0][1],orb=document.getElementById('breathOrb');function paint(){orb.textContent=`${phases[i][0]} ${left}`;orb.className='breath-orb '+phases[i][2]}paint();bt=setInterval(()=>{left--;if(left<=0){i++;if(i===phases.length){clearInterval(bt);orb.textContent='完成';orb.className='breath-orb';return}left=phases[i][1]}paint()},1000)};
let windAudio=null;document.getElementById('windBtn').onclick=e=>{if(windAudio){windAudio.close();windAudio=null;e.currentTarget.textContent='低声风声';return}try{let a=new(window.AudioContext||window.webkitAudioContext),len=a.sampleRate*2,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*.09;let s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;s.loop=true;f.type='lowpass';f.frequency.value=520;g.gain.value=.12;s.connect(f).connect(g).connect(a.destination);s.start();windAudio=a;e.currentTarget.textContent='关闭风声'}catch(_){}};
document.getElementById('boatsBtn').onclick=()=>document.getElementById('boats').classList.toggle('show');
const states=[{i:0,t:'疑惑',h:'先发现不对',d:'查看信封正反面，发现空白后停一下，再抬头说线索。',s:['看信封正面和背面','发现空白后停一下','抬头，把线索送给听众']},{i:3,t:'急迫',h:'目标不能丢',d:'字真的要消失。越着急，越要让重要信息保持清楚。',s:['看正在变淡的字','站稳吸气，身体朝灯塔','两条信息分开，不尖叫']},{i:5,t:'温暖坚定',h:'看见守护的意义',d:'灯塔照亮的是许多人回家的方向，不是夸自己。',s:['先看信，再看船','“不只是一盏灯”后停顿','用自己的声音把结尾说稳']}];function setState(n){let x=states[n];document.getElementById('stateImg').src=img(x.i);document.getElementById('stateType').textContent=x.t;document.getElementById('stateTitle').textContent=x.h;document.getElementById('stateDesc').textContent=x.d;document.getElementById('stateSteps').innerHTML=x.s.map(y=>`<span>${y}</span>`).join('')}document.querySelectorAll('.stateBtn').forEach(b=>b.onclick=()=>setState(+b.dataset.state));setState(0);
document.querySelectorAll('#transferGrid .overview-card').forEach(x=>x.onclick=()=>{let p=x.parentNode,was=x.classList.contains('active');p.querySelectorAll('.overview-card').forEach(c=>c.classList.remove('active'));x.classList.toggle('active',!was);p.classList.toggle('has',!was)});
let fi=0;const finalImg=document.getElementById('finalImg'),finalBg=document.getElementById('finalBg'),dots=document.getElementById('finalDots');scenes.forEach((_,i)=>{let b=document.createElement('button');b.className='dot';b.onclick=()=>setFinal(i);dots.appendChild(b)});function setFinal(n){fi=(n+6)%6;finalImg.src=img(fi);finalBg.style.backgroundImage=`url("${img(fi)}")`;document.getElementById('finalCount').textContent=`画面 ${fi+1} / 6`;[...dots.children].forEach((x,i)=>x.classList.toggle('on',i===fi))}document.getElementById('finalPrev').onclick=()=>setFinal(fi-1);document.getElementById('finalNext').onclick=()=>setFinal(fi+1);document.getElementById('overviewBtn').onclick=()=>document.getElementById('finalOverview').classList.toggle('show');document.getElementById('finishStory').onclick=e=>{lights[2]=1;renderLights();celebrateLight(2);e.currentTarget.textContent='第三盏已点亮 · 进入结尾';setTimeout(()=>show(20),1900)};setFinal(0);
let sec=0,tid=null,timer=document.getElementById('timer');function timePaint(){timer.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;timer.className='timer '+(sec>=90?'over':sec>=75?'warn':'')}document.getElementById('timerBtn').onclick=e=>{if(tid){clearInterval(tid);tid=null;e.currentTarget.textContent='继续计时'}else{tid=setInterval(()=>{sec++;timePaint()},1000);e.currentTarget.textContent='暂停'}};document.getElementById('timerReset').onclick=()=>{clearInterval(tid);tid=null;sec=0;timePaint();document.getElementById('timerBtn').textContent='开始计时'};
