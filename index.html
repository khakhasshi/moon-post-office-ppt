<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网页 PPT 课程目录</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06131c;
      --panel: rgba(255, 255, 255, .06);
      --line: rgba(255, 255, 255, .16);
      --text: #f5ecd8;
      --muted: #a8b8bd;
      --gold: #d9b365;
      --blue: #72c7d8;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 42px 22px;
      background:
        radial-gradient(circle at 80% 18%, rgba(114, 199, 216, .16), transparent 30%),
        radial-gradient(circle at 16% 70%, rgba(217, 179, 101, .14), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { width: min(960px, 100%); }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 5vw, 58px);
      font-family: "Songti SC", "STSong", serif;
      letter-spacing: .04em;
    }
    .lead {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    a {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .08), var(--panel));
      transition: transform .18s, border-color .18s;
    }
    a:hover {
      transform: translateY(-3px);
      border-color: rgba(217, 179, 101, .68);
    }
    b {
      display: block;
      color: var(--gold);
      font-size: 13px;
      letter-spacing: .18em;
    }
    strong {
      display: block;
      margin-top: 14px;
      font-size: 24px;
      line-height: 1.35;
      font-family: "Songti SC", "STSong", serif;
      font-weight: 600;
    }
    span {
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      a { min-height: 150px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>网页 PPT 课程目录</h1>
    <p class="lead">每堂课都有独立链接，可直接打开、投屏或分享。</p>
    <section class="grid" aria-label="课程链接">
      <a href="./moon-post-office/">
        <div>
          <b>LESSON 01</b>
          <strong>月亮邮局的最后一封信</strong>
        </div>
        <span>原 GitHub Pages 版本，已保留为独立链接。</span>
      </a>
      <a href="./seventh-page/">
        <div>
          <b>LESSON 02</b>
          <strong>消失的第七页航海日志</strong>
        </div>
        <span>压缩包中的当前入口版本。</span>
      </a>
      <a href="./seventh-page-legacy/">
        <div>
          <b>LEGACY</b>
          <strong>第七页航海日志旧结构版</strong>
        </div>
        <span>压缩包内保留的 legacyPages 版本，单独可访问。</span>
      </a>
    </section>
  </main>
</body>
</html>
